<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora en Línea con Flask</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .calculator { background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 300px; }
        input, select, button { width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 15px; font-weight: bold; text-align: center; color: #333; }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Calculadora Python</h2>
        <form method="POST">
            <input type="number" step="any" name="num1" placeholder="Número 1" required>
            <input type="number" step="any" name="num2" placeholder="Número 2" required>
            <select name="operacion">
                <option value="suma">Sumar (+)</option>
                <option value="resta">Restar (-)</option>
                <option value="multiplicacion">Multiplicar (×)</option>
                <option value="division">Dividir (÷)</option>
            </select>
            <button type="submit">Calcular</button>
        </form>
        {% if resultado is not none %}
            <div class="result">Resultado: {{ resultado }}</div>
        {% endif %}
    </div>
</body>
</html>
